# YOLO dataset config. prepare_dataset.py writes training/dataset/data.yaml from this template.
# Class names are matched by the app (case/space/dash-insensitive), so these exact names are recommended:
path: dataset
train: images/train
val: images/val
names:
  0: Person
  1: Hardhat
  2: NO-Hardhat
  3: Safety Vest
  4: NO-Safety Vest
